[project]
name = "transformer-from-scratch"
version = "0.1.0"

description = """
Implementation of the Transformer architecture from scratch using PyTorch, with a focus on 
understanding self-attention and the core building blocks."""

readme = "README.md"
authors = [
    { name = "ahmadrezabaqerzade", email = "ahmadrezabaqerzadeh@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "numpy>=2.5.4",
    "torch>=2.14.1",
]
license = "MIT"
license-files = ["LICENSE"]

[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
lint = [
    "ruff>=0.17.2",
]


[tool.ruff]
target-version = "py314"
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # Pyflakes
    "I",   # isort: import sorting
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
